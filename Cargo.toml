[package]
name = "mtree"
version = "1.0.0"
edition = "2021"
authors = ["Simon Konzett"]
license = "LGPL-3.0"
description = "High-performance M-Tree data structure with SIMD optimizations"

[features]
default = []
# Compile-time visit counters for plain k-NN. Zero overhead when off.
knn_stats = []

[lib]
name = "mtree"
path = "src/lib.rs"

[dependencies]
rayon = "1.8"
num-traits = "0.2"
